name: Browser interaction test
on:
  push:
    branches: [feature/ui-refresh]
  pull_request:
    branches: [main]
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-test.cjs
